<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Шашки</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#e8eeec;--ink:#17262a;--mut:#5d7276;--l:#d6e2dc;--d:#5b8a82;--frame:#1f3033;--acc:#e9a93a;--wp:#fffaf0;--bp:#16212a;--bs:min(88vw,68vh,620px);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1819;--ink:#e3eeec;--mut:#8aa3a6;--l:#a9c2ba;--d:#3f6a63;--frame:#050b0c;--bp:#0b1116}}
:root[data-theme="dark"]{--bg:#0f1819;--ink:#e3eeec;--mut:#8aa3a6;--l:#a9c2ba;--d:#3f6a63;--frame:#050b0c;--bp:#0b1116}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Spectral,Georgia,serif}
[hidden]{display:none!important}
.app{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-start;gap:28px;padding:20px 14px}
.frame{padding:clamp(8px,2vw,16px);background:var(--frame);border-radius:6px;box-shadow:0 22px 44px -20px rgba(5,20,20,.6)}
.board{display:grid;grid-template:repeat(8,1fr)/repeat(8,1fr);width:var(--bs);height:var(--bs)}
.sq{position:relative;display:grid;place-items:center;cursor:pointer;background-image:var(--b,none)}
.sq.l{background-color:var(--l);color:var(--d)}.sq.d{background-color:var(--d);color:var(--l)}
.sq[data-n]::before{content:attr(data-n);position:absolute;left:4px;top:2px}
.sq[data-f]::after{content:attr(data-f);position:absolute;right:4px;bottom:1px}
.sq[data-n]::before,.sq[data-f]::after{font-size:calc(var(--bs)/8*.17);font-weight:600}
.last{box-shadow:inset 0 0 0 100px rgba(233,169,58,.3)}
.must{box-shadow:inset 0 0 0 3px rgba(233,169,58,.55)}
.dot{--b:radial-gradient(circle,rgba(233,169,58,.95) 0 17%,transparent 19%)}
.sel{box-shadow:inset 0 0 0 3px var(--acc)}
.pc{width:78%;height:78%;border-radius:50%;display:grid;place-items:center;pointer-events:none;font-size:calc(var(--bs)/8*.45);line-height:1;box-shadow:0 3px 5px rgba(0,0,0,.45),inset 0 0 0 3px rgba(0,0,0,.2),inset 0 0 0 7px rgba(255,255,255,.14)}
.pc.w{background:radial-gradient(circle at 35% 30%,#fff,var(--wp) 55%,#d4c9b3);color:#8a6410}
.pc.b{background:radial-gradient(circle at 35% 30%,#3d4e5a,var(--bp) 62%);color:#e9c46a}
.side{width:min(88vw,300px);display:flex;flex-direction:column;gap:14px}
h1{font-size:2.6rem;font-weight:600;margin:0;letter-spacing:-.01em}
.status{font-size:1.15rem;margin:0;min-height:1.6em}
.vn,.cnt,.sub,#ruleinfo{margin:0;color:var(--mut)}
button,input{font:inherit;font-size:1rem;color:var(--ink);background:transparent;border:1.5px solid var(--frame);border-radius:4px;padding:9px 12px;cursor:pointer}
button:hover{background:rgba(91,138,130,.18)}
button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
button.primary,button.on{background:var(--frame);color:var(--bg)}
.row{display:flex;gap:8px}.row button{flex:1}
ol{margin:0;padding:0 0 0 1.6em;max-height:170px;overflow:auto;color:var(--mut);font-size:.95rem;font-variant-numeric:tabular-nums;line-height:1.6}
ol li span{display:inline-block;min-width:7em}
.menu{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px 14px;box-sizing:border-box}
.mcard{width:min(94vw,480px);display:flex;flex-direction:column;gap:18px;text-align:center}
.mlogo .pc{width:64px;height:64px;display:inline-block;margin:0 6px}
.menu h1{font-size:3.2rem}
.mgroup h2{font-size:.85rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);margin:0 0 8px}
.opts{display:flex;gap:8px}
.opt{flex:1;display:flex;flex-direction:column;gap:2px;padding:12px 6px}
.opt span{font-size:.8rem;color:var(--mut)}.opt.on span{color:inherit;opacity:.75}
.big{font-size:1.3rem;padding:14px}
</style>
<script>
if(!window.structuredClone)window.structuredClone=o=>JSON.parse(JSON.stringify(o));
addEventListener('error',e=>{const d=document.createElement('div');d.style.cssText='position:fixed;left:0;right:0;top:0;z-index:99;background:#b3261e;color:#fff;padding:8px;font:14px sans-serif';d.textContent='Ошибка: '+e.message;(document.body||document.documentElement).append(d)});
(function(){try{
 if(window.AndroidBridge&&AndroidBridge.VKWebAppInit)AndroidBridge.VKWebAppInit(JSON.stringify({}));
 else if(window.webkit&&webkit.messageHandlers&&webkit.messageHandlers.VKWebAppInit)webkit.messageHandlers.VKWebAppInit.postMessage({});
 else if(parent!==window)parent.postMessage({handler:'VKWebAppInit',params:{},type:'vk-connect'},'*')}catch(e){}})();
</script>
<script async src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js" onload="try{vkBridge.send('VKWebAppInit',{})}catch(e){}"></script>
<script src="https://sad.adsgram.ai/js/sad.min.js"></script>
<script>
  window.AdController = window.Adsgram ? window.Adsgram.init({ blockId: "9091750628" }) : null;
</script>
</head><body>
<div id="menu" class="menu"><div class="mcard">
<div class="mlogo" aria-hidden="true"><span class="pc w"></span><span class="pc b"></span></div>
<h1>Шашки</h1>
<div class="mgroup"><h2>Режим</h2><div class="opts" data-k="mode">
<button class="opt on" data-v="2"><b>Вдвоём</b><span>на одном устройстве</span></button>
<button class="opt" data-v="1"><b>С компьютером</b><span>против бота</span></button></div></div>
<div class="mgroup"><h2>Правила</h2><div class="opts" data-k="rule">
<button class="opt on" data-v="ru"><b>Русские</b></button>
<button class="opt" data-v="br"><b>Бразильские</b></button>
<button class="opt" data-v="en"><b>Английские</b></button></div></div>
<div class="mgroup"><h2>Цель игры</h2><div class="opts" data-k="goal">
<button class="opt on" data-v="n"><b>Классика</b><span>забрать все шашки</span></button>
<button class="opt" data-v="g"><b>Поддавки</b><span>потерять все шашки</span></button></div></div>
<div id="vsai" hidden>
<div class="mgroup"><h2>Ваша сторона</h2><div class="opts" data-k="side">
<button class="opt on" data-v="w"><b>Белые</b><span>ходят первыми</span></button>
<button class="opt" data-v="b"><b>Чёрные</b></button>
<button class="opt" data-v="r"><b>Случайно</b></button></div></div>
<div class="mgroup"><h2>Сложность</h2><div class="opts" data-k="lvl">
<button class="opt on" data-v="0"><b>Лёгкий</b></button>
<button class="opt" data-v="1"><b>Средний</b></button>
<button class="opt" data-v="2"><b>Сильный</b></button></div></div></div>
<p id="ruleinfo"></p>
<button id="play" class="primary big">Играть</button>
</div></div>
<div id="game" hidden><main class="app">
<section><div class="frame"><div id="board" class="board" role="grid" aria-label="Доска"></div></div></section>
<aside class="side">
<h1>Шашки</h1>
<p class="vn" id="vn"></p>
<p id="status" class="status" aria-live="polite"></p>
<p class="cnt" id="cnt"></p>
<div class="row"><button id="undo">Отменить ход</button><button id="flip">Повернуть</button></div>
<button id="new" class="primary">Новая партия</button>
<button id="tomenu">← В меню</button>
<ol id="log"></ol>
</aside></main></div>
<script>
const $=s=>document.querySelector(s);
// ===== ДВИЖОК =====
const RULES={ru:{back:1,fly:1,maj:0,promo:'cont'},br:{back:1,fly:1,maj:1,promo:'stop'},en:{back:0,fly:0,maj:0,promo:'end'}};
const D=[[1,1],[1,-1],[-1,1],[-1,-1]],inb=(r,c)=>r>=0&&r<8&&c>=0&&c<8,sqn=(r,c)=>'abcdefgh'[c]+(8-r),lo=p=>p.toLowerCase();
function fresh(){const b=Array.from({length:8},()=>Array(8).fill(null));
 for(let r=0;r<8;r++)for(let c=0;c<8;c++)if((r+c)%2){if(r<3)b[r][c]='b';else if(r>4)b[r][c]='w'}
 return{b,t:'w',q:0,last:null,lg:[]}}
function capsFrom(b,r0,c0,R){const p=b[r0][c0],me=lo(p),fw=me==='w'?-1:1,last=me==='w'?0:7;b[r0][c0]=null;
 const go=(r,c,king,path,took)=>{const out=[];
  for(const[dr,dc]of D){if(!king&&!R.back&&dr!==fw)continue;
   let y=r+dr,x=c+dc;if(king&&R.fly)while(inb(y,x)&&!b[y][x]){y+=dr;x+=dc}
   if(!inb(y,x)||!b[y][x]||lo(b[y][x])===me||took.some(t=>t[0]===y&&t[1]===x))continue;
   const t2=[...took,[y,x]],cont=[],term=[];let ly=y+dr,lx=x+dc;
   while(inb(ly,lx)&&!b[ly][lx]){
    const k2=king||(ly===last&&R.promo!=='stop'),np=[...path,[ly,lx]],
     sub=(!king&&ly===last&&R.promo==='end')?[]:go(ly,lx,k2,np,t2);
    if(sub.length)cont.push(...sub);else term.push({from:[r0,c0],path:np,caps:t2,k:k2||ly===last});
    if(!(king&&R.fly))break;ly+=dr;lx+=dc}
   out.push(...(cont.length?cont:term))}
  return out};
 const res=go(r0,c0,p!==me,[],[]);b[r0][c0]=p;return res}
function moves(S,R){const{b,t}=S,caps=[],out=[];
 for(let r=0;r<8;r++)for(let c=0;c<8;c++)if(b[r][c]&&lo(b[r][c])===t)caps.push(...capsFrom(b,r,c,R));
 if(caps.length){if(R.maj){const m=Math.max(...caps.map(x=>x.caps.length));return caps.filter(x=>x.caps.length===m)}return caps}
 for(let r=0;r<8;r++)for(let c=0;c<8;c++){const p=b[r][c];if(!p||lo(p)!==t)continue;const king=p!==t,fw=t==='w'?-1:1;
  for(const[dr,dc]of D){if(!king&&dr!==fw)continue;let y=r+dr,x=c+dc;
   while(inb(y,x)&&!b[y][x]){out.push({from:[r,c],path:[[y,x]],caps:[],k:king||y===(t==='w'?0:7)});if(!(king&&R.fly))break;y+=dr;x+=dc}}}
 return out}
function apply(S,m){const b=S.b.map(r=>r.slice()),[r,c]=m.from,p=b[r][c],e=m.path[m.path.length-1];
 b[r][c]=null;for(const[y,x]of m.caps)b[y][x]=null;b[e[0]][e[1]]=m.k?S.t.toUpperCase():S.t;
 return{b,t:S.t==='w'?'b':'w',q:(m.caps.length||p===lo(p))?0:S.q+1,last:[m.from,...m.path],lg:S.lg}}
function outcome(S,ms,G){if(!ms.length)return G?S.t:(S.t==='w'?'b':'w');return S.q>=60?'d':null}
function ev(S,me,G){let v=0;for(let r=0;r<8;r++)for(let c=0;c<8;c++){const p=S.b[r][c];if(!p)continue;const s=lo(p),x=p!==s?3.2:1+.05*(s==='w'?7-r:r);v+=s===me?x:-x}return G?-v:v}
function mm(S,d,a,bt,me,R,G){const ms=moves(S,R),o=outcome(S,ms,G);
 if(o)return o==='d'?0:(o===me?1e4+d:-1e4-d);
 if(!d)return ev(S,me,G);
 const mx=S.t===me;let best=mx?-1e9:1e9;
 for(const m of ms){const v=mm(apply(S,m),d-1,a,bt,me,R,G);
  if(mx){if(v>best)best=v;if(best>a)a=best}else{if(v<best)best=v;if(best<bt)bt=best}
  if(a>=bt)break}
 return best}
function ai(S,R,G,lvl){const ms=moves(S,R),me=S.t,dp=[1,3,5][lvl];let best=null,bs=-1e9;
 for(const m of ms){const v=mm(apply(S,m),dp-1,-1e9,1e9,me,R,G)+Math.random()*(lvl?.05:1.5);if(v>bs){bs=v;best=m}}
 return best}
// ===== ИНТЕРФЕЙС =====
const NAMES={ru:'Русские',br:'Бразильские',en:'Английские'};
let S,H=[],sel=null,legalSel=[],flip=false,mode=2,hu='w',lvl=0,R=RULES.ru,G=false,rk='ru',over=false,busy=false,gid=0;

let gamesPlayed = 0;
function showTgAd(callback) {
  if (window.AdController) {
    window.AdController.show().then(callback).catch(callback);
  } else {
    console.log('[Симуляция рекламы в Telegram]');
    if (callback) callback();
  }
}

function render(){const B=$('#board');B.innerHTML='';const ms=moves(S,R),oc=outcome(S,ms,G);over=!!oc;
 const must=new Set(ms.filter(m=>m.caps.length).map(m=>m.from+''));let nw=0,nb=0;
 for(let i=0;i<64;i++){let r=i>>3,c=i%8;if(flip){r=7-r;c=7-c}
  const q=document.createElement('div'),p=S.b[r][c];q.className='sq '+((r+c)%2?'d':'l');q.dataset.r=r;q.dataset.c=c;
  if(i%8===0)q.dataset.n=8-r;if(i>=56)q.dataset.f='abcdefgh'[c];
  if(S.last&&S.last.some(a=>a[0]===r&&a[1]===c))q.classList.add('last');
  if(sel&&sel[0]===r&&sel[1]===c)q.classList.add('sel');
  if(legalSel.some(m=>{const e=m.path[m.path.length-1];return e[0]===r&&e[1]===c}))q.classList.add('dot');
  if(p){const s=document.createElement('span');s.className='pc '+lo(p);if(p!==lo(p))s.textContent='♛︎';q.append(s);
   lo(p)==='w'?nw++:nb++;if(!over&&lo(p)===S.t&&must.has(r+','+c))q.classList.add('must')}
  B.append(q)}
 $('#status').textContent=oc==='d'?'Ничья':oc?`Победили ${oc==='w'?'белые':'чёрные'}`:`Ход ${S.t==='w'?'белых':'чёрных'}`+(ms[0]&&ms[0].caps.length?' — бить обязательно':'');
 $('#cnt').textContent=`Белых: ${nw} · чёрных: ${nb}`;
 let h='';for(let i=0;i<S.lg.length;i+=2)h+=`<li><span>${S.lg[i]}</span>${S.lg[i+1]||''}</li>`;
 const o=$('#log');o.innerHTML=h;o.scrollTop=o.scrollHeight}
function play(m){const pts=[m.from,...m.path],name=pts.map(a=>sqn(a[0],a[1])).join(m.caps.length?':':'–'),
 rc=a=>$(`.sq[data-r="${a[0]}"][data-c="${a[1]}"]`).getBoundingClientRect(),rs=pts.map(rc);
 H.push(S);const lg=[...S.lg,name];S=apply(S,m);S.lg=lg;sel=null;legalSel=[];render();
 const e=pts[pts.length-1],q=$(`.sq[data-r="${e[0]}"][data-c="${e[1]}"]`),el=q.firstElementChild,t=q.getBoundingClientRect();
 if(el&&el.animate&&!matchMedia('(prefers-reduced-motion: reduce)').matches){q.style.zIndex=5;
  el.animate(rs.map(a=>({transform:`translate(${a.left-t.left}px,${a.top-t.top}px)`})).concat([{transform:'none'}]),{duration:200*pts.length,easing:'ease-in-out'}).onfinish=()=>{q.style.zIndex=''}}
 aiTurn()}
function aiTurn(){if(mode===1&&!over&&S.t!==hu){busy=true;const g=gid;setTimeout(()=>{if(g!==gid)return;busy=false;const m=ai(S,R,G,lvl);if(m)play(m)},400)}}

function initGame() {
  gid++;S=fresh();H=[];sel=null;legalSel=[];busy=false;
  $('#vn').textContent=NAMES[rk]+(G?' · поддавки':'')+(mode===1?' · против компьютера':' · вдвоём');render();aiTurn()
}

function start(){
  gamesPlayed++;
  if (gamesPlayed > 1 && gamesPlayed % 2 === 1) {
    showTgAd(initGame);
  } else {
    initGame();
  }
}

$('#board').onclick=e=>{const q=e.target.closest('.sq');if(!q||over||busy)return;const r=+q.dataset.r,c=+q.dataset.c;
 const m=legalSel.find(m=>{const f=m.path[m.path.length-1];return f[0]===r&&f[1]===c});
 if(m){play(m);return}
 const p=S.b[r][c];sel=null;legalSel=[];
 if(p&&lo(p)===S.t&&(mode===2||S.t===hu)){const l=moves(S,R).filter(m=>m.from[0]===r&&m.from[1]===c);if(l.length){sel=[r,c];legalSel=l}}
 render()};
$('#new').onclick=start;
$('#flip').onclick=()=>{flip=!flip;render()};
$('#undo').onclick=()=>{
  if(H.length<(mode===1&&hu==='b'?2:1)||busy)return;
  showTgAd(() => {
    S=H.pop();
    if(mode===1&&S.t!==hu&&H.length)S=H.pop();
    sel=null;
    legalSel=[];
    render();
  });
};
$('#tomenu').onclick=()=>{gid++;busy=false;$('#game').hidden=true;$('#menu').hidden=false};
const MS={mode:'2',rule:'ru',goal:'n',side:'w',lvl:'0'},INFO={ru:'Простые шашки бьют и назад, дамки ходят на любое расстояние. Бить обязательно.',br:'Как русские, но нужно выбирать взятие с максимумом побитых шашек.',en:'Простые шашки бьют только вперёд, дамка ходит на одну клетку. Бить обязательно.'};
function info(){$('#ruleinfo').textContent=INFO[MS.rule]+(MS.goal==='g'?' Поддавки: выигрывает тот, кто первым лишится всех шашек или ходов.':' Выигрывает тот, кто забрал все шашки или лишил соперника ходов.')}
document.querySelectorAll('.opts').forEach(g=>g.onclick=e=>{const b=e.target.closest('.opt');if(!b)return;
 g.querySelectorAll('.opt').forEach(x=>x.classList.toggle('on',x===b));MS[g.dataset.k]=b.dataset.v;$('#vsai').hidden=MS.mode!=='1';info()});
$('#play').onclick=()=>{mode=+MS.mode;lvl=+MS.lvl;rk=MS.rule;R=RULES[rk];G=MS.goal==='g';
 hu=MS.side==='r'?(Math.random()<.5?'w':'b'):MS.side;flip=mode===1&&hu==='b';
 $('#menu').hidden=true;$('#game').hidden=false;start()};
info();
</script></body></html>
